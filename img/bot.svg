<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .ojo { fill:#9dd68a; transform-box:fill-box; transform-origin:center; animation:parpadeo 4s infinite; }
    @keyframes parpadeo { 0%,92%,100% { transform:scaleY(1); } 96% { transform:scaleY(.1); } }
  </style>
  <!-- antena -->
  <line x1="60" y1="14" x2="60" y2="27" stroke="#12291c" stroke-width="4" stroke-linecap="round"/>
  <circle cx="60" cy="11" r="6" fill="#f4c95d" stroke="#12291c" stroke-width="3"/>
  <!-- cuerpo -->
  <rect x="38" y="90" width="44" height="22" rx="11" fill="#2f6b3f" stroke="#12291c" stroke-width="4"/>
  <circle cx="60" cy="101" r="4" fill="#fdfcfa"/>
  <!-- orejas -->
  <rect x="10" y="48" width="14" height="24" rx="7" fill="#2f6b3f" stroke="#12291c" stroke-width="4"/>
  <rect x="96" y="48" width="14" height="24" rx="7" fill="#2f6b3f" stroke="#12291c" stroke-width="4"/>
  <!-- cabeza -->
  <rect x="20" y="26" width="80" height="66" rx="28" fill="#fdfcfa" stroke="#12291c" stroke-width="4"/>
  <!-- pantalla -->
  <rect x="31" y="37" width="58" height="42" rx="20" fill="#12291c"/>
  <circle class="ojo" cx="48" cy="55" r="6"/>
  <circle class="ojo" cx="72" cy="55" r="6"/>
  <path d="M52 66 Q60 73 68 66" fill="none" stroke="#9dd68a" stroke-width="3.5" stroke-linecap="round"/>
  <!-- mejillas -->
  <circle cx="39" cy="67" r="3.5" fill="#f08a8a" opacity=".75"/>
  <circle cx="81" cy="67" r="3.5" fill="#f08a8a" opacity=".75"/>
</svg>
