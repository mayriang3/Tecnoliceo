<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Panel de profesores | Tecnoliceo</title>
    <link rel="icon" type="image/png" href="/img/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,700;1,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/Estilos/styles.css?v=2">
    <link rel="stylesheet" href="/Estilos/cuentas.css?v=2">
</head>
<body class="cuentas" data-pagina="profesores">
<header>
    <a href="index.html">
        <div class="logo">
            <img src="/img/logo.png" alt="Logo TecnoLiceo" class="logo-img">
            <h1>TecnoLiceo</h1>
        </div>
    </a>

    <!-- Iconos (se definen una vez y se reutilizan) -->

    </svg>

    <!-- Menú de navegación -->
    <nav class="botones_principales">
        <a href="index.html" class="botonn" aria-label="Inicio">
            <svg class="icono"><use href="#i-home"/></svg>
            <span class="texto">Inicio</span>
        </a>
        <a href="info.html" class="botonn" aria-label="Información general">
            <svg class="icono"><use href="#i-info"/></svg>
            <span class="texto">Información general</span>
        </a>
        <a href="material.html" class="botonn" aria-label="Material de Estudio">
            <svg class="icono"><use href="#i-book"/></svg>
            <span class="texto">Material de Estudio</span>
        </a>
        <a href="preguntas.html" class="botonn" aria-label="Preguntas Frecuentes">
            <svg class="icono"><use href="#i-help"/></svg>
            <span class="texto">Preguntas Frecuentes</span>
        </a>

        <!-- Botón "Más" con menú desplegable -->
        <div class="mas">
            <button type="button" class="botonn" id="btnMas" aria-label="Más" aria-expanded="false" aria-controls="menuMas">
                <svg class="icono"><use href="#i-more"/></svg>
                <span class="texto">Más</span>
            </button>
            <div class="menu-mas" id="menuMas">
                <a href="admin.html" class="botonn item-menu">
                    <svg class="icono"><use href="#i-admin"/></svg>
                    <span class="texto">admin</span>
                </a>
                <a href="login.html" class="botonn item-menu">
                    <svg class="icono"><use href="#i-user"/></svg>
                    <span class="texto">Login</span>
                </a>
            </div>
        </div>
    </nav>
</header>

    <main class="cu-main">
        <section class="cu-tarjeta cu-ancha" id="cu-contenido" hidden>
            <div class="cu-cab">
                <img src="/img/bot.svg" alt="">
                <div><h2 id="cu-saludo">Hola</h2><span id="cu-sub"></span></div>
                <button class="cu-sec" id="cu-salir">Salir</button>
            </div>
            <div class="cu-cuerpo">
                <h3 class="cu-h3">Mis tareas</h3>
                <div id="gestion-tareas"></div>
                <h3 class="cu-h3">Mis módulos</h3>
                <div id="gestion-modulos"></div>
                <h3 class="cu-h3">Mis estudiantes</h3>
                <div id="gestion-estudiantes"></div>
            </div>
        </section>
    </main>

    <footer>
        <h2>TecnoLiceo</h2>
        <p>
            Plataforma informativa con módulos educativos
            sobre la Modalidad Técnica en Informática.
        </p>
        <p class="footer-copy">
            © 2026 - Institución Educativa Liceo Tame
        </p>
    </footer>
<script src="/js/cuentas.js?v=2"></script>
<script src="/js/estudiantes.js?v=1"></script>
<script src="/js/tareas.js?v=1"></script>
<script src="/js/modulos.js?v=3"></script>
</body>
</html>
