<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Panel de profesores | Tecnoliceo</title>
    <link rel="icon" type="image/png" href="/img/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,700;1,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/Estilos/styles.css">
    <link rel="stylesheet" href="/Estilos/cuentas.css?v=2">
</head>
<body class="cuentas" data-pagina="profesores">
    <header>
        <a href="index.html">
        <div class="logo">
            <img src="/img/logo.png" alt="Logo TecnoLiceo" class="logo-img">
            <h1>TecnoLiceo</h1>
        </div>
        </a>

        <section class="botones_principales">
            <a href="index.html"><button class="botonn">Inicio</button></a>
            <a href="info.html"><button class="botonn">Información general</button></a>
            <a href="material.html"><button class="botonn">Material de Estudio</button></a>
            <a href="preguntas.html"><button class="botonn">Preguntas Frecuentes</button></a>
            <a href="login.html"><button class="botonn">Ingresar</button></a>
        </section>
    </header>

    <main class="cu-main">
        <section class="cu-tarjeta cu-ancha" id="cu-contenido" hidden>
            <div class="cu-cab">
                <img src="/img/bot.svg" alt="">
                <div><h2 id="cu-saludo">Hola</h2><span id="cu-sub"></span></div>
                <button class="cu-sec" id="cu-salir">Salir</button>
            </div>
            <div class="cu-cuerpo">
                <h3 class="cu-h3">Mis tareas</h3>
                <div id="gestion-tareas"></div>
                <h3 class="cu-h3">Mis estudiantes</h3>
                <div id="gestion-estudiantes"></div>
                <h3 class="cu-h3">Próximamente</h3>
                <div class="cu-bloques">
                    <div>Módulos<small>Próximamente</small></div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <h2>TecnoLiceo</h2>
        <p>
            Plataforma informativa con módulos educativos
            sobre la Modalidad Técnica en Informática.
        </p>
        <p class="footer-copy">
            © 2026 - Institución Educativa Liceo Tame
        </p>
    </footer>
<script src="/js/cuentas.js?v=2"></script>
<script src="/js/estudiantes.js?v=1"></script>
<script src="/js/tareas.js?v=1"></script>

</html>
