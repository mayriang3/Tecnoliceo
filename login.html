<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Ingresar | Tecnoliceo</title>
    <link rel="icon" type="image/png" href="/img/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,700;1,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/Estilos/styles.css">
    <link rel="stylesheet" href="/Estilos/cuentas.css?v=1">
</head>
<body class="cuentas" data-pagina="login">
    <header>
        <a href="index.html">
        <div class="logo">
            <img src="/img/logo.png" alt="Logo TecnoLiceo" class="logo-img">
            <h1>TecnoLiceo</h1>
        </div>
        </a>

        <section class="botones_principales">
            <a href="index.html"><button class="botonn">Inicio</button></a>
            <a href="info.html"><button class="botonn">Información general</button></a>
            <a href="material.html"><button class="botonn">Material de Estudio</button></a>
            <a href="preguntas.html"><button class="botonn">Preguntas Frecuentes</button></a>
            <a href="login.html"><button class="botonn">Ingresar</button></a>
        </section>
    </header>

    <main class="cu-main">
        <section class="cu-tarjeta">
            <div class="cu-cab">
                <img src="/img/bot.svg" alt="">
                <div><h2>Ingresar</h2><span>Entra con tu usuario y tu clave</span></div>
            </div>
            <div class="cu-cuerpo">
                <label for="cu-usuario">Usuario</label>
                <input id="cu-usuario" autocomplete="username" autocapitalize="none" spellcheck="false">
                <label for="cu-clave">Clave</label>
                <input id="cu-clave" type="password" autocomplete="current-password">
                <p class="cu-error" id="cu-error" role="alert"></p>
                <button class="cu-btn" id="cu-enviar">Entrar</button>
                <p class="cu-pie">¿Eres estudiante y aún no tienes cuenta? <a href="registro.html">Regístrate con el código de tu grado</a></p>
            </div>
        </section>
    </main>

    <footer>
        <h2>TecnoLiceo</h2>
        <p>
            Plataforma informativa con módulos educativos
            sobre la Modalidad Técnica en Informática.
        </p>
        <p class="footer-copy">
            © 2026 - Institución Educativa Liceo Tame
        </p>
    </footer>
<script src="/js/cuentas.js?v=1"></script>
</body>
</html>
