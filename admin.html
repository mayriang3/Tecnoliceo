<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin | TecnoLiceo</title>
  <link rel="icon" type="image/svg+xml" href="/img/bot.svg">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root { --oscuro:#12291c; --verde:#2f6b3f; --claro:#9dc983; --crema:#fdfcfa; --suave:#eef3e6; --texto:#1f2a22; --gris:#6b7a70; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px 16px 48px; background: var(--claro); color: var(--texto); font-family: 'DM Sans', system-ui, sans-serif; }
    .caja { max-width: 780px; margin: 0 auto 24px; background: var(--crema); border-radius: 24px; overflow: hidden; box-shadow: 0 12px 32px rgba(18,41,28,.22); }
    .barra { display: flex; align-items: center; gap: 14px; padding: 16px 24px; background: var(--oscuro); color: #fff; }
    .barra img { width: 50px; height: 50px; border-radius: 50%; background: var(--claro); padding: 4px; }
    .barra h1 { flex: 1; margin: 0; font-family: 'Fraunces', Georgia, serif; font-size: 1.35rem; }
    .cuerpo { padding: 24px; }
    label { display: block; margin: 0 0 5px; font-size: .78rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--verde); }
    input, textarea { width: 100%; padding: 11px 14px; margin-bottom: 14px; border: 1.5px solid #d4dfca; border-radius: 14px; background: #fff; font: inherit; color: inherit; outline: none; }
    input:focus, textarea:focus { border-color: var(--verde); box-shadow: 0 0 0 3px rgba(47,107,63,.15); }
    textarea { min-height: 120px; resize: vertical; }
    .ayuda { margin: -8px 0 14px; font-size: .82rem; color: var(--gris); }
    button { padding: 10px 20px; border: 0; border-radius: 999px; background: var(--oscuro); color: #fff; font: inherit; font-weight: 500; cursor: pointer; transition: background .15s; }
    button:hover { background: var(--verde); }
    button.sec { background: var(--suave); color: var(--oscuro); border: 1.5px solid #d4dfca; }
    button.sec:hover { background: #e2ebd8; }
    button.rojo { background: #fff; color: #b3372f; border: 1.5px solid #e6bdb9; }
    button.rojo:hover { background: #b3372f; color: #fff; }
    .barra button.sec { background: rgba(255,255,255,.12); color: #fff; border-color: rgba(255,255,255,.3); }
    .barra button.sec:hover { background: rgba(255,255,255,.22); }
    .titulo-lista { margin: 28px 0 8px; font-family: 'Fraunces', Georgia, serif; font-size: 1.15rem; }
    .item { display: flex; gap: 14px; justify-content: space-between; align-items: center; padding: 14px 16px; margin-bottom: 10px; background: #fff; border: 1.5px solid #e3ead9; border-radius: 16px; }
    .item strong { display: block; margin-bottom: 6px; line-height: 1.35; }
    .item small { display: inline-block; padding: 2px 10px; border-radius: 999px; background: var(--suave); color: var(--verde); font-size: .75rem; font-weight: 700; }
    .acciones { display: flex; gap: 6px; flex-shrink: 0; }
    .acciones button { padding: 7px 14px; font-size: .88rem; }
    #msg { min-height: 1.2em; margin: 12px 0 0; color: #b3372f; }
    @media (max-width: 520px) { .item { flex-direction: column; align-items: stretch; } .acciones { justify-content: flex-end; } }
  </style>
</head>
<body>
  <div class="caja" id="login">
    <div class="barra"><img src="/img/bot.svg" alt=""><h1>Panel de administración</h1></div>
    <div class="cuerpo">
      <label for="clave">Contraseña</label>
      <input id="clave" type="password" autocomplete="current-password">
      <button id="entrar">Entrar</button>
      <a href="preguntas.html"><button>Volver</button></a>
      <p id="msg"></p>
    </div>
  </div>

  <div class="caja" id="panel" hidden>
    <div class="barra">
      <img src="/img/bot.svg" alt="">
      <h1>Preguntas frecuentes/Panel de admin</h1>
      <button class="sec" id="salir">Salir</button>
    </div>
    <div class="cuerpo">
      <input id="id" type="hidden">
      <label for="categoria">Categoría</label>
      <input id="categoria" placeholder="Ej: Antes de inscribirte">
      <label for="pregunta">Pregunta</label>
      <input id="pregunta">
      <label for="respuesta">Respuesta</label>
      <textarea id="respuesta"></textarea>
      <p class="ayuda">Usa **así** para negrita. Cada salto de línea se respeta.</p>
      <label for="palabras_clave">Palabras clave (separadas por espacios, sin tildes)</label>
      <input id="palabras_clave">
      <button id="guardar">Guardar</button>
      <button class="sec" id="cancelar" hidden>Cancelar edición</button>
      <h2 class="titulo-lista">Preguntas guardadas</h2>
      <div id="lista"></div>
    </div>
  </div>
  <script>
const $ = (id) => document.getElementById(id);
const CAMPOS = ["categoria", "pregunta", "respuesta", "palabras_clave"];

async function api(url, metodo = "GET", cuerpo) {
  const r = await fetch(url, {
    method: metodo,
    headers: { "Content-Type": "application/json" },
    body: cuerpo ? JSON.stringify(cuerpo) : undefined,
  });
  if (r.status === 401 && !url.includes("login")) { mostrar(false); throw new Error("no autorizado"); }
  return { ok: r.ok, datos: await r.json() };
}

function mostrar(dentro) {
  $("login").hidden = dentro;
  $("panel").hidden = !dentro;
  if (dentro) { cargar(); cargarSugerencias(); }
}

function boton(texto, clase, alClic) {
  const b = document.createElement("button");
  b.className = clase;
  b.textContent = texto;
  b.onclick = alClic;
  return b;
}

// ---------- Preguntas frecuentes ----------
async function cargar() {
  const { datos } = await api("/api/admin/faq");
  const lista = $("lista");
  lista.innerHTML = "";
  datos.forEach((f) => {
    const fila = document.createElement("div");
    fila.className = "item";
    const info = document.createElement("div");
    const t = document.createElement("strong");
    t.textContent = f.pregunta;
    const c = document.createElement("small");
    c.textContent = f.categoria;
    info.append(t, c);
    const acc = document.createElement("div");
    acc.className = "acciones";
    acc.append(
      boton("Editar", "sec", () => editar(f)),
      boton("Borrar", "rojo", async () => {
        if (confirm("¿Borrar esta pregunta?")) { await api("/api/admin/faq/" + f.id, "DELETE"); cargar(); }
      })
    );
    fila.append(info, acc);
    lista.appendChild(fila);
  });
}

function editar(f) {
  $("id").value = f.id;
  CAMPOS.forEach((k) => ($(k).value = f[k]));
  $("cancelar").hidden = false;
  $("guardar").textContent = "Guardar cambios";
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function limpiar() {
  $("id").value = "";
  CAMPOS.forEach((k) => ($(k).value = ""));
  $("cancelar").hidden = true;
  $("guardar").textContent = "Guardar";
}

// ---------- Sugerencias ----------
async function cargarSugerencias() {
  const { datos } = await api("/api/admin/sugerencias");
  const cont = $("sugerencias");
  cont.innerHTML = "";
  const nuevas = datos.filter((s) => Number(s.leida) !== 1).length;
  $("contador").textContent = nuevas;
  $("contador").hidden = nuevas === 0;

  if (!datos.length) {
    const p = document.createElement("p");
    p.className = "ayuda";
    p.textContent = "Todavía no hay sugerencias.";
    cont.appendChild(p);
    return;
  }

  datos.forEach((s) => {
    const nueva = Number(s.leida) !== 1;
    const fila = document.createElement("div");
    fila.className = "item" + (nueva ? " nueva" : "");
    const info = document.createElement("div");
    const t = document.createElement("strong");
    t.textContent = s.texto;
    info.append(t);
    // Etiquetas: tema, grado, nombre, fecha y estado
    [s.tema, s.grado ? "Grado " + s.grado : "", s.nombre, s.creado.slice(0, 16), nueva ? "Nueva" : "Leída"]
      .filter(Boolean)
      .forEach((txt) => {
        const f = document.createElement("small");
        f.textContent = txt;
        f.style.marginRight = "6px";
        info.append(f);
      });

    const acc = document.createElement("div");
    acc.className = "acciones";
    acc.append(
      // Responder: pasa la sugerencia al formulario para crear la pregunta
      boton("Responder", "", async () => {
        limpiar();
        $("pregunta").value = s.texto;
        if (s.tema && s.tema !== "Otro") $("categoria").value = s.tema;
        if (nueva) await api("/api/admin/sugerencias/" + s.id, "PUT", { leida: true });
        cargarSugerencias();
        window.scrollTo({ top: 0, behavior: "smooth" });
        $("categoria").focus();
      }),
      boton(nueva ? "Marcar leída" : "Marcar nueva", "sec", async () => {
        await api("/api/admin/sugerencias/" + s.id, "PUT", { leida: nueva });
        cargarSugerencias();
      }),
      boton("Borrar", "rojo", async () => {
        if (confirm("¿Borrar esta sugerencia?")) { await api("/api/admin/sugerencias/" + s.id, "DELETE"); cargarSugerencias(); }
      })
    );
    fila.append(info, acc);
    cont.appendChild(fila);
  });
}

// ---------- Formulario y sesión ----------
$("guardar").onclick = async () => {
  const cuerpo = {};
  CAMPOS.forEach((k) => (cuerpo[k] = $(k).value));
  const id = $("id").value;
  const r = id ? await api("/api/admin/faq/" + id, "PUT", cuerpo) : await api("/api/admin/faq", "POST", cuerpo);
  if (!r.ok) { alert(r.datos.error || "No se pudo guardar"); return; }
  limpiar();
  cargar();
};
$("cancelar").onclick = limpiar;

$("entrar").onclick = async () => {
  try {
    const r = await api("/api/admin/login", "POST", { clave: $("clave").value });
    if (r.ok) { $("clave").value = ""; $("msg").textContent = ""; mostrar(true); }
    else $("msg").textContent = "Contraseña incorrecta";
  } catch (e) {
    $("msg").textContent = "No se pudo conectar con el servidor.";
  }
};
$("clave").addEventListener("keydown", (e) => { if (e.key === "Enter") $("entrar").click(); });
$("salir").onclick = async () => { await api("/api/admin/logout", "POST"); mostrar(false); };

api("/api/admin/estado")
  .then((r) => mostrar(r.datos.admin === true))
  .catch(() => {
    $("msg").textContent = "No se pudo conectar con el servidor. Recarga la página.";
    mostrar(false);
  });
  </script>
</body>
</html>
